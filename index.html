<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8" />
  <title>+ Sinergia 2026</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="description" content="Proyectos de Sinergia 2026" />
  <meta name="keywords" content="Sinergia, 2026, Proyectos, Tecnología, Informática, Arte, Sociedad, Salud, Negocios
    , ORT, ORT proyecto final" />
  <link rel="icon" type="image/png" href="https://campus.ort.edu.ar/static/tmp/jquery-file-upload/thumbnail/mas.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

  <link href="https://fonts.googleapis.com/css2?family=Mukta:wght@200&display=swap" rel="stylesheet" />
  <style>
    body {
      font-family: "Mukta", sans-serif;
      margin: 0;
      padding: 0;
      background-color: var(--bg);
      color: var(--text);
      transition: background-color 0.3s ease, color 0.3s ease;
    }

    header {
      text-align: center;
    }

    .banner-container {
      background-color: #1d1d1b;
      padding: 20px 0;
      width: 100%;
      transition: background-color 0.3s ease;
    }

    /* Asegurar que el banner mantenga siempre el color #1d1d1b */
    :root[data-theme='light'] .banner-container,
    :root[data-theme='dark'] .banner-container {
      background-color: #1d1d1b !important;
    }

    #logo-image {
      max-width: 100%;
      height: auto;
    }

    .navbar {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      background-color: #fff;
      padding: 10px 20px;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
    }

    .navbar-buttons {
      display: flex;
      gap: 10px;
    }

    .button-55 {

      border: 0.2px solid #ffffff;
      border-radius: 25px;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
      color: #007bff;
      font-weight: bold;
      padding: 10px 20px;
      text-transform: uppercase;
      cursor: pointer;
      transition: all 0.3s ease;
    }


    /* Colores específicos para cada botón */
    .btn-sinergizado {
      background-color: #3a3836;
      /* Naranja */
      color: white;
    }

    .btn-sinergizado:hover {
      background-color: #676564;
      color: white;
    }

    .btn-web {
      background-color: #2196f3;
      /* Azul */
      color: white;
    }

    .btn-web:hover {
      background-color: #87CEEB;
      color: #fff;
    }

    .btn-servicios {
      background-color: #a226b8;
      /* Azul */
      color: white;
    }

    .btn-servicios:hover {
      background-color: #712080;
      color: #fff;
    }

    .btn-bien-tangible {
      background-color: #16b819;
      /* Morado */
      color: white;
    }

    .btn-bien-tangible:hover {
      background-color: #1a761b;
      color: #fff;
    }

    .btn-App {
      background-color: #e91e63;
      /* Rosa */
      color: white;
    }

    .btn-App:hover {
      background-color: #ba0944;
    }

    .btn-todos {
      background-color: #607d8b;
      /* Gris */
      color: white;
    }

    .btn-todos:hover {
      background-color: #4a5f69;
    }

    /* Botones dentro de las tarjetas */
    .card-button {
      background-color: transparent;
      /* Por defecto */
      color: white;
      padding: 10px;
      border-radius: 8px;
      cursor: pointer;
    }

    #buscador {
      border: 1px solid #ddd;
      border-radius: 4px;
      padding: 10px;
      font-size: 16px;
    }

    .container {
      padding: 20px;
      background-color: var(--bg);
      transition: background-color 0.3s ease;
    }

    /* Estilo general del contenedor de tarjetas */
    .card-container {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
      /* Espacio entre tarjetas */
      justify-content: center;
      position: relative;
      /* Asegurar contexto de apilamiento correcto */
      z-index: 0;
    }



    /* Estilos para tarjetas */
    .flip-card {
      background-color: transparent;
      width: 100%;
      max-width: 292px;
      /* Ajusta el tamaño según tus necesidades */
      /*margin: 20px;*/
      perspective: 1000px;
      border-radius: 10px;
      position: relative;
      z-index: 1;
      overflow: hidden;
      /*box-shadow: rgba(0, 0, 0, 0.2) 0px 4px 6px,
                rgba(0, 0, 0, 0.19) 0px 6px 12px;*/
    }

    .flip-card-inner {
      position: relative;
      width: 100%;
      height: 440px;
      text-align: center;
      transition: transform 0.8s ease-in-out;
      transform-style: preserve-3d;
      border-radius: 10px;
      transform-origin: center center;
    }

    .flip-card.girar .flip-card-inner {
      transform: rotateY(180deg);
    }

    .flip-card.girar {
      z-index: 10;
    }

    /* Asegurar que cada tarjeta mantenga su propio contexto */
    .flip-card:hover {
      z-index: 5;
    }

    /* Contenedor de tarjetas con contexto de apilamiento */
    .card-container>* {
      position: relative;
    }

    .flip-card-front,
    .flip-card-back {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      -webkit-backface-visibility: hidden;
      backface-visibility: hidden;
      border-radius: 10px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 20px;
      box-sizing: border-box;
      z-index: 2;
      transition: background-color 0.3s ease, color 0.3s ease;
    }

    .flip-card-front {
      background-color: var(--card);
      color: var(--text);
      box-shadow: rgba(0, 0, 0, 0.2) 0px 4px 6px,
        rgba(0, 0, 0, 0.19) 0px 6px 12px;
    }

    .flip-card-back {
      background-color: var(--card-2);
      /* Color de fondo más claro */
      color: var(--text);
      transform: rotateY(180deg);
      box-shadow: inset 0 0 10px rgba(0, 0, 0, 0.1);
      transform-origin: center center;
      /* Asegurar que el contenido se mantenga dentro de los límites */
      overflow: hidden;
    }

    .flip-card img {
      width: 100%;
      height: auto;
      max-height: 200px;
      /* Limita la altura de la imagen */
      object-fit: cover;
      /* Ajusta la imagen para cubrir el área */
      border-radius: 10px;
    }

    .flip-card h2,
    .flip-card p {
      margin: 0;
      padding: 10px;
      font-family: "Mukta", sans-serif;
      color: var(--text);
    }

    .flip-card h2 {
      font-size: 1.2em;
      font-weight: bold;
      margin-bottom: 10px;
    }

    .flip-card p {
      font-size: 1em;
    }

    /* Botón "Girar" */
    .girar-button {
      background-color: #ff9800;
      border-radius: 100px;
      box-shadow: rgba(163, 44, 187, 0.2) 0 -25px 18px -14px inset,
        rgba(187, 44, 187, 0.15) 0 1px 2px, rgba(175, 44, 187, 0.15) 0 2px 4px,
        rgba(187, 44, 177, 0.15) 0 4px 8px,
        rgba(187, 44, 165, 0.15) 0 8px 16px,
        rgba(154, 44, 187, 0.15) 0 16px 32px;
      color: #fff;
      cursor: pointer;
      display: inline-block;
      font-family: "Mukta", sans-serif;
      font-weight: bold;
      padding: 10px 20px;
      text-align: center;
      text-decoration: none;
      transition: all 250ms;
      border: 0;
      font-size: 16px;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
      position: absolute;
      bottom: 10px;
      right: 10px;
      z-index: 1;
    }

    .girar-button:hover {
      background-color: #f57c00;
      box-shadow: rgba(163, 44, 187, 0.25) 0 -25px 18px -14px inset,
        rgba(154, 44, 187, 0.25) 0 1px 2px, rgba(168, 44, 187, 0.25) 0 2px 4px,
        rgba(149, 44, 187, 0.25) 0 4px 8px,
        rgba(187, 44, 175, 0.25) 0 8px 16px,
        rgba(161, 44, 187, 0.25) 0 16px 32px;
      transform: scale(1.05) rotate(-1deg);
    }

    #scrollToTopButton {
      /*background: url("/static/archivos/anim/1663176/2012790/top.png")*/
      background: url("top.png") no-repeat center;
      border: none;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      cursor: pointer;
      background-size: cover;
      position: fixed;
      bottom: 20px;
      right: 20px;
      z-index: 1000;
      display: none;
    }

    #scrollToTopButton:hover {
      background-color: rgba(0, 0, 0, 0.1);
    }

    .modal {
      display: none;
      /* Initially hidden */
      position: fixed;
      z-index: 999;
      /* Ensure it's above other content */
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      overflow: auto;
      background-color: rgba(0, 0, 0, 0.4);
      /* Semi-transparent background */
      display: flex;
      align-items: center;
      /* Center vertically */
      justify-content: center;
      /* Center horizontally */
    }

    .modal-content {
      background-color: #fbfbfb;
      padding: 20px;
      border-radius: 8px;
      width: 80%;
      max-width: 600px;
      /* Maximum width of the modal */
    }


    .close {
      color: #aaa;
      float: right;
      font-size: 28px;
      font-weight: bold;
    }

    .close:hover,
    .close:focus {
      color: #000;
      text-decoration: none;
      cursor: pointer;
    }



    @media (max-width: 1024px) {
      .navbar {
        gap: 12px;
      }

      .navbar-buttons {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 10px;
        width: 100%;
      }

      .button-55 {
        width: 100%;
        text-align: center;
      }

      .card-container {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 20px;
      }

      #buscador {
        width: 100%;
        margin-top: 15px;
      }
    }

    @media (max-width: 768px) {
      .navbar {
        justify-content: space-around;
        flex-direction: column;
        align-items: stretch;
      }

      .navbar-buttons {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 10px;
        justify-content: center;
      }

      .button-55 {
        width: 100%;
        text-align: center;
      }

      .card-container {
        grid-template-columns: 1fr;
      }

      #buscador {
        width: 100%;
        margin-top: 15px;
      }
    }

    @media (max-width: 480px) {
      .navbar {
        justify-content: space-around;
        flex-direction: column;
      }

      .navbar-buttons {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 10px;
        justify-content: center;
      }

      .button-55 {
        font-size: 14px;
        padding: 8px 15px;
      }

      .flip-card {
        height: auto;
      }

      .girar-button {
        bottom: 5px;
        right: 5px;
      }

      #buscador {
        width: 100%;
        margin-top: 15px;
      }
    }

    /* ====== PRO THEME (Tech) Overrides ====== */
    :root {
      --bg: #0b1020;
      --card: #11182c;
      --card-2: #0e1426;
      --text: #e6edf3;
      --muted: #9fb0c3;
      --primary: #4cc3ff;
      --primary-600: #2aa7e0;
      --accent: #8b5cf6;
      --success: #22c55e;
      --warning: #f59e0b;
      --danger: #ef4444;
      --ring: 0 0 0 2px rgba(76, 195, 255, 0.25);
      --shadow-lg: 0 10px 30px rgba(0, 0, 0, .45);
      --shadow-md: 0 6px 18px rgba(0, 0, 0, .35);
    }

    /* Base */
    body {
      background: radial-gradient(1200px 800px at 10% -10%, rgba(76, 195, 255, .08), transparent),
        radial-gradient(1000px 600px at 110% 10%, rgba(139, 92, 246, .07), transparent),
        var(--bg);
      color: var(--text);
    }

    header {
      background: var(--card);
      border-bottom: 1px solid rgba(255, 255, 255, .06);
    }

    /* El contenedor del banner mantiene siempre el color #1d1d1b */
    .banner-container {
      background: #1d1d1b !important;
    }

    .navbar {
      background: rgba(17, 24, 44, .65);
      backdrop-filter: saturate(160%) blur(8px);
      -webkit-backdrop-filter: saturate(160%) blur(8px);
      border-bottom: 1px solid rgba(255, 255, 255, .06);
      box-shadow: var(--shadow-md);
    }

    #buscador {
      background: var(--card);
      border: 1px solid rgba(255, 255, 255, .08);
      color: var(--text);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, .04);
    }

    #buscador::placeholder {
      color: var(--muted);
    }

    #buscador:focus {
      outline: none;
      box-shadow: var(--ring);
      border-color: var(--primary);
    }

    /* Buttons */
    .button-55 {
      background: linear-gradient(180deg, rgba(76, 195, 255, .12), rgba(76, 195, 255, .06));
      border: 1px solid rgba(76, 195, 255, .35);
      color: var(--text);
      letter-spacing: .3px;
    }

    .button-55:hover {
      transform: translateY(-1px);
      box-shadow: 0 8px 20px rgba(76, 195, 255, .15);
    }

    .button-55.is-active {
      box-shadow: 0 0 0 2px rgba(255, 255, 255, 0.14), 0 10px 20px rgba(76, 195, 255, 0.25);
      filter: brightness(1.05);
      transform: translateY(-1px);
    }

    .button-55:active {
      transform: translateY(0);
    }

    .btn-sinergizado {
      background: linear-gradient(180deg, rgba(139, 92, 246, .18), rgba(139, 92, 246, .08));
      border-color: rgba(139, 92, 246, .4);
    }

    .btn-sinergizado:hover {
      background: linear-gradient(180deg, rgba(139, 92, 246, .24), rgba(139, 92, 246, .10));
    }

    .btn-web {
      background: linear-gradient(180deg, rgba(76, 195, 255, .18), rgba(76, 195, 255, .08));
      border-color: rgba(76, 195, 255, .45);
    }

    .btn-web:hover {
      background: linear-gradient(180deg, rgba(135, 206, 235, .35), rgba(135, 206, 235, .20));
    }

    .btn-servicios {
      background: linear-gradient(180deg, rgba(162, 38, 184, .20), rgba(162, 38, 184, .08));
      border-color: rgba(162, 38, 184, .4);
    }

    .btn-bien-tangible {
      background: linear-gradient(180deg, rgba(34, 197, 94, .20), rgba(34, 197, 94, .08));
      border-color: rgba(34, 197, 94, .4);
    }

    .btn-App {
      background: linear-gradient(180deg, rgba(244, 114, 182, .20), rgba(244, 114, 182, .08));
      border-color: rgba(244, 114, 182, .35);
    }

    .btn-todos {
      background: linear-gradient(180deg, rgba(148, 163, 184, .20), rgba(148, 163, 184, .08));
      border-color: rgba(148, 163, 184, .35);
    }

    /* Cards */
    .flip-card {
      border-radius: 14px;
      overflow: visible;
      max-width: 320px;
    }

    .flip-card-inner {
      box-shadow: var(--shadow-lg);
      border-radius: 14px;
      height: 480px;
    }

    .flip-card-front,
    .flip-card-back {
      border-radius: 14px;
    }

    .flip-card-front {
      background: linear-gradient(180deg, var(--card), var(--card-2));
      color: var(--text);
      border: 1px solid rgba(255, 255, 255, .06);
      padding-top: 12px;
      position: relative;
      overflow: hidden;
    }

    .flip-card-back {
      background: linear-gradient(180deg, var(--card-2), var(--card));
      color: var(--text);
      border: 1px solid rgba(255, 255, 255, .06);
      overflow: hidden;
    }

    .flip-card h2,
    .flip-card h3 {
      color: var(--text);
      margin: 8px 0 2px;
      font-size: clamp(18px, 2.2vw, 20px);
    }

    .flip-card p {
      color: var(--muted);
      margin: 6px 0 0;
      font-size: clamp(13px, 1.9vw, 14px);
    }

    .line-1 {
      display: -webkit-box;
      -webkit-line-clamp: 1;
      line-clamp: 1;
      -webkit-box-orient: vertical;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .line-2 {
      display: -webkit-box;
      -webkit-line-clamp: 2;
      line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .slogan {
      opacity: .9;
    }

    .flip-card img {
      border: 1px solid rgba(255, 255, 255, .06);
      border-radius: 10px;
      width: 100%;
      aspect-ratio: 1 / 1;
      object-fit: cover;
    }

    .flip-card .front-body {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 6px;
      align-items: flex-start;
      text-align: left;
    }

    .flip-card .meta {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 6px;
    }

    .flip-card .badge {
      padding: 4px 8px;
      border-radius: 999px;
      border: 1px solid rgba(255, 255, 255, .08);
      background: rgba(255, 255, 255, .04);
      color: var(--text);
      font-size: 12px;
    }

    .flip-card-back .content-scroll {
      height: calc(100% - 48px);
      overflow: auto;
      padding-right: 6px;
      text-align: left;
      width: 100%;
    }

    .flip-card-back .content-scroll::-webkit-scrollbar {
      width: 8px;
    }

    .flip-card-back .content-scroll::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, .12);
      border-radius: 8px;
    }

    #descCard {
      cursor: pointer;
    }

    /* Accent glows by category */
    .Web .flip-card-front {
      box-shadow: 0 0 0 1px rgba(76, 195, 255, .35), 0 8px 30px rgba(76, 195, 255, .18);
    }

    .Servicio .flip-card-front {
      box-shadow: 0 0 0 1px rgba(162, 38, 184, .35), 0 8px 30px rgba(162, 38, 184, .18);
    }

    .Bien .flip-card-front {
      box-shadow: 0 0 0 1px rgba(34, 197, 94, .35), 0 8px 30px rgba(34, 197, 94, .18);
    }

    .App .flip-card-front {
      box-shadow: 0 0 0 1px rgba(244, 114, 182, .35), 0 8px 30px rgba(244, 114, 182, .18);
    }

    .SinergizadoC.flip-card-front,
    .SinergizadoC .flip-card-front {
      box-shadow: 0 0 0 1px rgba(139, 92, 246, .35), 0 8px 30px rgba(139, 92, 246, .18);
    }

    /* CTA on card */
    .girar-button {
      background: linear-gradient(180deg, var(--primary), var(--primary-600));
      box-shadow: 0 10px 25px rgba(76, 195, 255, .25);
      border: 0;
    }

    .girar-button:hover {
      filter: brightness(1.05);
      transform: translateY(-1px);
    }

    /* Scroll to top */
    #scrollToTopButton {
      box-shadow: 0 10px 25px rgba(0, 0, 0, .35);
    }

    #scrollToTopButton:hover {
      box-shadow: 0 12px 28px rgba(76, 195, 255, .25);
    }

    /* Container spacing */
    .container {
      max-width: 1600px;
      margin: 0 auto;
    }

    .card-container {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 20px;
      align-items: stretch;
    }

    .flip-card {
      width: 100%;
      max-width: none;
    }

    /* Typography */
    @supports (font-variation-settings: normal) {
      body {
        font-feature-settings: "calt" on, "liga" on;
      }
    }

    /* Reduce harsh borders on modal */
    .modal-content {
      background: var(--card);
      color: var(--text);
      border: 1px solid rgba(255, 255, 255, .08);
      box-shadow: var(--shadow-lg);
    }

    .close {
      color: var(--muted);
    }

    .close:hover {
      color: var(--text);
    }

    /* Light/Dark toggle */
    .theme-toggle {
      min-width: 44px;
      height: 40px;
      padding: 0 10px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
    }

    /* Theme palettes */
    :root[data-theme='dark'] {
      --bg: #0b1020;
      --card: #11182c;
      --card-2: #0e1426;
      --text: #e6edf3;
      --muted: #9fb0c3;
      --primary: #4cc3ff;
      --primary-600: #2aa7e0;
      --accent: #8b5cf6;
      --success: #22c55e;
      --warning: #f59e0b;
      --danger: #ef4444;
    }

    :root[data-theme='light'] {
      --bg: #f6f8fb;
      --card: #ffffff;
      --card-2: #f3f6fb;
      --text: #0f172a;
      --muted: #475569;
      --primary: #2563eb;
      --primary-600: #1d4ed8;
      --accent: #7c3aed;
      --success: #16a34a;
      --warning: #d97706;
      --danger: #dc2626;
    }

    /* Ribbon Sinergizado (diagonal corner) */
    .ribbon {
      position: absolute;
      top: 0;
      right: -94%;
      width: 210%;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 6px 0;
      padding-left: 30%;
      transform: rotate(45deg);
      background: linear-gradient(90deg, rgba(139, 92, 246, .98), rgba(139, 92, 246, .85));
      color: #fff;
      font-weight: 800;
      font-size: 12px;
      letter-spacing: .6px;
      text-transform: uppercase;
      box-shadow: 0 8px 22px rgba(0, 0, 0, .35);
      border-top: 1px solid rgba(255, 255, 255, .22);
      border-bottom: 1px solid rgba(0, 0, 0, .25);
      z-index: 2;
      pointer-events: none;
      white-space: nowrap;
    }

    /* Responsive grid breakpoints */
    @media (max-width: 1400px) {
      .card-container {
        grid-template-columns: repeat(4, minmax(0, 1fr));
      }
    }

    @media (max-width: 1100px) {

    // THEME: init as soon as possible, read preference
    (function initTheme() {
      try {
        var saved = localStorage.getItem('theme');
        var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
        var theme = saved || (prefersDark ? 'dark' : 'light');
        document.documentElement.setAttribute('data-theme', theme);
      } catch (e) { }
    })();

    window.onload = function () {
      try {
        var btn = document.getElementById('themeToggle');
        var setIcon = function (theme) { btn.textContent = theme === 'dark' ? '🌙' : '☀️'; };
        var current = document.documentElement.getAttribute('data-theme') || 'light';
        setIcon(current);
        btn.addEventListener('click', function () {
          var cur = document.documentElement.getAttribute('data-theme') || 'light';
          var next = cur === 'dark' ? 'light' : 'dark';
          document.documentElement.setAttribute('data-theme', next);
          try { localStorage.setItem('theme', next); } catch (e) { }
          setIcon(next);
        });
      } catch (e) { }

      mostrarTodos();
    };

    // Truncate sin cortar palabras (devuelve string <= maxChars)
    function safeTruncate(text, maxChars) {
      try {
        if (typeof text !== 'string') return '';
        if (text.length <= maxChars) return text;
        var sliced = text.slice(0, maxChars);
        var lastSpace = sliced.lastIndexOf(' ');
        if (lastSpace > 0) return sliced.slice(0, lastSpace);
        return sliced; // si no hay espacio, devolvemos el corte limpio
      } catch (e) { return text; }
    }

    //// truncar descripciones
    function truncateDescription(description, wordCount, item) {
      if (description == undefined) {
        return `<p id="descCard"><b>Descripción:</b> Sin descripción</p><br>`;
      } else {
        if (description.length > 100) {
          const words = description.split(" ");
          if (words.length <= wordCount) {
            return `<pid="descCard"><b>Descripción:</b> ${description}</p><br>`;
          }
          let truncatedWords = words.slice(0, wordCount);
          truncatedWords = truncatedWords.join(" ");

          return `<p onclick="mostrarDescripcionCompleta('${description}')" title="leer +" id="descCard"><b>Descripción:</b> ${truncatedWords} ...(+)</p>
            
            `;
          //   return `<p>${truncatedWords}  ...</p><button class="leer-mas-button" onclick="mostrarDescripcionCompleta('${description}')">Leer más</button>
        } else {
          return `<p id="descCard"><b>Descripción:</b> ${description}</p><br>`;
        }
      }
    }

    function truncateData(tipoProduccion, cha, cantidad, txt) {
      if (typeof tipoProduccion !== 'string' || !tipoProduccion) {
        return '';
      } else {
        const words = tipoProduccion.split(cha);
        //const truncatedWord = [words[0], words[1]] ; // Truncamos y quitamos posibles espacios en blanco

        const truncatedWords = words[1] ? `${words[0]}, ${words[1]}` : words[0];

        if (words.length > 0) {
          // Si no hay un guion, mostramos solo la primera palabra
          return `<b onclick="mostrarDescripcionCompleta('${tipoProduccion}')">${txt}:</b> ${truncatedWords}<br>`;
        } else {
          return `<b>${txt}:</b> ${tipoProduccion}<br>`;
        }
      }
    }

    // Obtiene una URL directa de visualización para logos, incluyendo enlaces de Google Drive
    function getLogoSrc(item) {
      try {
        var logo = item.Logo;
        if (!logo || typeof logo !== 'string') {
          return `https://recursos.ort.edu.ar/static/archivos/anim/1663176/2412476/${item.id}.png`;
        }

        // Normalizar strings
        var trimmed = logo.trim();

        // Si es un enlace de Google Drive, convertir a vista directa
        if (trimmed.includes('drive.google.com')) {
          var driveId = '';

          // Caso open?id=XXXX o uc?id=XXXX
          var idMatch = trimmed.match(/[?&]id=([^&#]+)/);
          if (idMatch && idMatch[1]) {
            driveId = idMatch[1];
          }

          // Caso /file/d/XXXX/
          if (!driveId) {
            var fileMatch = trimmed.match(/\/file\/d\/([^/]+)/);
            if (fileMatch && fileMatch[1]) {
              driveId = fileMatch[1];
            }
          }

          if (driveId) {
            return `https://drive.google.com/uc?export=view&id=${driveId}`;
          }
        }

        // Si es otra URL válida, usarla tal cual
        return trimmed;
      } catch (e) {
        return `https://campus.ort.edu.ar/static/tmp/jquery-file-upload/${item.id}.png`;
      }
    }

    "Descripcion": "Teniendo en cuenta que numerosas enfermedades crónicas no transmisibles son causadas por el estrés oxidativo, orientamos nuestro proyecto a encontrar un compuesto natural que pudiera brindar protección a las células. Queriendo comprobar el mito del jugo de apio “milagroso”, encontramos que Apium graveolens posee potencial antioxidante y buscamos comprobar esta propiedad en un modelo de bacterias E. coli.\nSe obtuvieron extractos de hojas y tallos de apio mediante procesos de secado en estufa, molienda, maceración y centrifugación. La cuantificación de flavonoides se llevó a cabo mediante el método de Folin-Ciocalteu, realizando una curva de calibración con ácido tánico como estándar utilizando el espectrofotómetro, lo que permitió determinar concentraciones y establecer que las hojas presentan mayor contenido de flavonoides que los tallos.\nPara evaluar el efecto antioxidante, se diseñaron bioensayos en los que cultivos bacterianos fueron expuestos a radiación ultravioleta (UV) en presencia y ausencia de distintas concentraciones de extracto de apio por diferentes plazos de tiempo. Se consideró como indicador indirecto del estrés oxidativo la actividad enzimática de la catalasa, estimada a partir de la disminución de la concentración de peróxido de hidrógeno medida por espectrofotometría. Paralelamente, se analizó el crecimiento bacteriano de colonias con la hipótesis de que aquellas con menor protección ante la luz UV, podrían sufrir alteraciones en su metabolismo, manifestándose como una menor tasa de división celular.\nEn base a los resultados cuantitativos y cualitativos obtenidos, podemos inferir que el apio posee propiedades antioxidantes naturales, mayormente en sus hojas,  que podrían servir para la prevención y disminución de los efectos dañinos del estrés oxidativo en la salud.",

    "Descripcion": "Actividad antioxidante, antimicrobiana y cicatrizante de un extracto de Ocimum basilicum: evaluación en frutas, cultivos microbianos y lombrices.\nEl trabajo realizado tuvo como objetivo evaluar tanto las propiedades antimicrobianas y cicatrizantes de un extracto hidroalcohólico de albahaca (Ocimum basilicum), a partir de la presencia de compuestos bioactivos como el eugenol y el linalool, como también su propiedad antioxidante, vinculada a su contenido rico en ácido rosmarínico. Para ello, se preparó el extracto mediante maceración en etanol al 70%, seguida de filtración y concentración. Su composición fue analizada de forma preliminar mediante cromatografía en capa fina (TLC), evidenciando su presencia.\nLa actividad antimicrobiana se evaluó mediante cultivos en agar a partir de microorganismos presentes en frutas (manzana y palta), aplicando el extracto sobre discos de papel filtro. Se observó un efecto limitado, sin inhibición completa del crecimiento microbiano, lo que sugiere una posible acción bacteriostática dependiente de las condiciones experimentales.\nLa propiedad antioxidante se analizó en muestras de manzana (Golden Delicious) y palta (Persea americana) bajo distintas condiciones. A pesar de que mediante la reacción química de yodo se demostró que el extracto posee poder reductor, en ambos casos, el extracto aceleró el pardeamiento, evidenciando un comportamiento pro-oxidante. Este efecto podría explicarse por la alta concentración de compuestos fenólicos, que en determinadas condiciones pueden favorecer reacciones de oxidación en lugar de inhibirlas. \nPor último, la actividad cicatrizante se evaluó en lombrices californianas (Eisenia foetida) mediante la comparación entre grupos control y tratados. Si bien se observaron indicios de una mejor integración del tejido en los organismos tratados, las limitaciones metodológicas impidieron obtener resultados concluyentes.\nEn síntesis, el extracto de albahaca no mostró una efectividad consistente en las propiedades evaluadas. Los resultados sugieren que su actividad depende de variables como la concentración, el método de extracción y el sistema biológico analizado. Este estudio aporta evidencia preliminar y destaca la necesidad de optimizar las condiciones experimentales para futuras investigaciones.",

    "Descripcion": "Extracción de la vitamina A y C para la conformación de una crema hidratante. \n\nCon el objetivo de extraer Vitamina A y C de la zanahoria y la naranja respectivamente para producir una crema hidratante aprovechando sus propiedades antioxidantes, generamos dos soluciones extractivas. \nPara la primera solución utilizamos zanahoria rallada, agua destilada y etanol, mientras que para la segunda utilizamos naranja y agua destilada. La zanahoria posee beta-caroteno el cual es el precursor de la vitamina A, la cual contiene propiedades antioxidantes, rejuvenecedoras, regenerativas y favorece la producción de colágeno.\nEn cambio la naranja posee vitamina C, la cual es antioxidante al igual que la vitamina A, es clarificante y protectora, además de otorgar luminosidad cutánea.\nDejamos macerar ambas extracciones en frascos oscuros y con aluminio para evitar la degradación por rayos UV y luego verificamos la presencia de las vitaminas a partir de reacciones redox. \nPor último, producimos una crema base con Vaselina, glicerina, cera autoemulsionable no iónica y agua destilada a la cual le colocamos los extractos. A esta crema le medimos el pH antes y después de la colocación de las soluciones como forma de verificación, asegurando que el pH se mantenga dentro de un rango compatible con la piel para no provocar irritación ni daño cutáneo.\nCon respecto a los resultados, se pueden destacar tres. Para empezar obtuvimos efectivamente extractos con vitamina A y C a partir de los elementos electos. A su vez, pudimos terminar con una crema utilizable en la piel en la cual pudimos incorporar las vitaminas sin afectar al pH requerido.\nComo conclusión, a partir de los extractos obtenidos de la zanahoria y la naranja, confirmamos la presencia de las vitaminas A y C. Con estos componentes, desarrollamos una crema hidratante con potencial efecto antioxidante y humectante. Quedaría por confirmar que las concentraciones de las vitaminas sean adecuadas para conseguir el efecto esperado en la piel.",

    "Slogan": "El poder cicatrizante del resveratrol",
    "Descripcion": "La industria vitivinícola genera una enorme cantidad de residuos orgánicos que podrían ser de mucha utilidad para las industrias químicas, farmacéuticas, cosméticas y alimentarias. Uno de los mayores residuos es la cáscara de uva, la cual es rica en compuestos bioactivos como el pterostilbeno, los flavonoides y polifenoles como el resveratrol. Este último, es conocido por sus propiedades antioxidantes, y  en los últimos años se lo estudia por sus potenciales efectos antiinflamatorios y cicatrizantes. \nLas lombrices californianas son comúnmente utilizadas como modelo experimental debido a que su estructura dérmica tiene similitudes con la estructura de la humana. Otra ventaja que presentan es que son fáciles de criar y mantener en las condiciones adecuadas.\nPor lo tanto, el objetivo de este trabajo fue evaluar las capacidades antiinflamatorias y cicatrizantes del resveratrol extraído de cáscaras de uvas negras, a partir de un protocolo de lesión y tratamiento de las capas superiores de la dermis de las lombrices.\nA partir de cáscaras de uva se realizó una extracción alcohólica para obtener el resveratrol presente. Posteriormente, se evaporó el solvente hasta obtener una solución final con una concentración 0,05 g/ml de resveratrol (extracto de uva). Para poner a punto la efectividad del resveratrol extraído se diseñó una serie de tratamientos: lombrices sin extracto, lombrices tratadas con extracto de uva y lombrices tratadas con extracto de farmacia. Se realizaron tres ensayos donde se cortaron las capas superiores de la piel de las lombrices y se aplicó cada tratamiento. Cómo resultado, se obtuvo que el extracto de uva tiene efectos similares al extracto de farmacia.\nEn conclusión, el extracto obtenido de resveratrol podría tener un efecto cicatrizante en heridas superficiales. Sin embargo, más estudios son necesarios para confirmar estos efectos en el modelo experimental de lombriz.",

    "Descripcion": "Biofilm para la biorremediación de recursos hídricos contaminados por microplásticos\n\nSe propone una estrategia de biorremediación para aguas contaminadas por microplásticos (partículas plásticas <5 mm) basada en biofilms bacterianos. Los microplásticos están ampliamente distribuidos en ambientes acuáticos y terrestres. Aunque su estudio es relativamente reciente, se sabe que pueden persistir durante largos periodos y actuar como vectores de contaminantes químicos, con posibles impactos en la salud y los ecosistemas. Su marcada hidrofobicidad facilita la colonización por microorganismos y la formación de biofilms sobre sus superficies. \nLos biofilms son comunidades microbianas inmersas en una matriz de exopolisacáridos que tiene la capacidad de adsorber microplásticos. El proyecto incluyó la detección y caracterización de microplásticos en aguas urbanas, el aislamiento y cultivo de inóculos naturales para formar biofilms, y ensayos de adsorción.\nEn base a esto, evaluamos si biofilms crecidos en condiciones de laboratorio a partir de muestras de agua y sustrato del Parque Centenario, son capaces de adsorber significativamente los microplásticos presentes en el ecosistema. La presencia y el desarrollo del biofilm se verificaron mediante tinción con cristal violeta y observación microscópica.\nPara los ensayos de adsorción, expusimos cuatro placas con biofilm y cuatro placas control sin biofilm a una solución que contenía microplásticos. Tras un protocolo de lavados, examinamos las placas al microscopio y cuantificamos la cantidad de partículas adheridas mediante un software de análisis de imágenes (Image-J). \nLos resultados mostraron un incremento de 3,8 en la adsorción de microplásticos en las placas con biofilm, respecto a los controles, en concordancia con referencias previas. Esta evidencia sugiere que el aprovechamiento de biofilms podría ser una herramienta viable para la remediación de microplásticos en sistemas acuáticos, aunque se requieren estudios adicionales sobre escalabilidad y efectos ecológicos, junto con el mejoramiento de la metodología de cuantificación de microplásticos. Además, se deben evaluar riesgos asociados y propuestas de implementación práctica futura.",

    "Descripcion": "En los últimos años, el hongo de la especie Hericium erinaceus, conocida como melena de león, adquirió una notable popularidad como complemento natural para acompañar tratamientos médicos y como suplemento alimentario, distribuido ampliamente en el mercado como producto de venta libre. Esta popularidad se debe a la asociación de su consumo con beneficios sobre la memoria, la concentración y el estado de ánimo, entre otros. Estos efectos son atribuidos a la presencia de compuestos como las hericenonas y las erinacinas, que actuarían modulando el sistema nervioso. Sin embargo, la evidencia de ello, continúa siendo escasa. \nEn estudios previos, se ha utilizado como modelo para estudiar los efectos del extracto del hongo melena de león, ejemplares de Danio rerio (pez cebra), debido a la similitud en la organización y funcionamiento de su sistema nervioso con el de los seres humanos. \nEl objetivo de este trabajo fue evaluar los posibles efectos tranquilizantes del extracto de melena de león en un modelo experimental de pez cebra. Para cumplir con este objetivo, se puso a punto la obtención de extracto del hongo melena de león y se diseñó un protocolo de tratamiento para estudiar sus efectos sobre el comportamiento de los peces, sumado a descartar un efecto adverso o análogo del solvente de extracción.\nSe realizaron observaciones comparativas del comportamiento, analizando variables como el tiempo de respuesta frente al alimento y el nivel de actividad general tras la exposición al extracto, con el fin de identificar posibles efectos sedantes.\nEn base a los resultados obtenidos, tanto en lo cualitativo como en los promedios de tiempo de alimentación, podemos inferir que el extracto de hongo melena de león tiene un efecto tranquilizante sobre los peces cebra. Esto genera una evidencia más sólida sobre los posibles efectos en humanos.",

    "Descripcion": "\nEl aumento global de trastornos metabólicos como la diabetes incentivaron la búsqueda de alternativas naturales para el control glucémico. Investigaciones previas comprobaron que la canela posee actividad potenciadora de la insulina y puede reducir productos finales de glicación avanzada. Asimismo, se observó en modelos murinos que el polvo de canela regula la gluconeogénesis hepática y mejora la síntesis de glucógeno. \n\nEl objetivo de este proyecto fue evaluar si la canela tiene un efecto reductor de glucosa en el nemátodo Caenorhabditis elegans, un modelo biológico eficaz debido a su facilidad de manipulación, ciclo de vida corto y metabolismo comparable al de los humanos.\n\nPara el desarrollo experimental, se preparó agar nutritivo autoclavado suplementado con glucosa a una concentración final de 0,06% m/v. Se emplearon bacterias Escherichia coli OP50 como alimentación. Se establecieron tres condiciones: un grupo basal (sin glucosa), un grupo control (con glucosa) y un grupo experimental que recibió 500 µl por placa de una solución de canela (1g/10ml), previamente purificada y esterilizada mediante jeringas de filtración. Los organismos se cultivaron durante 4 días, asegurando la absorción metabólica del compuesto. \n\nPosteriormente, la biomasa se recolectó mediante lavados y centrifugación. La lisis celular se indujo mediante ciclos de congelación y descongelación para liberar el contenido intracelular y cuantificarlo con un glucómetro. Los resultados mostraron que el grupo basal resultó en una lectura de LOW (menor a 10 mg/dL), el grupo control alcanzó 25 mg/dL, mientras que el grupo tratado con canela descendió a 13 mg/dL.\n\nEn conclusión, la reducción en la glucosa interna valida el potencial de la canela en este modelo. Este estudio apoya y verifica los hallazgos preexistentes en la ciencia, consolidando la evidencia sobre la eficacia del compuesto en la regulación de la glucemia.",

    "Descripcion": "La presente investigación estudia el potencial poder conservante de extractos naturales obtenidos de la canela (Cinnamomum spp.) y orégano (Origanum spp.), especias que contienen compuestos bioactivos con reconocida actividad antimicrobiana. La canela posee el compuesto “cinamaldehído”, mientras que el orégano posee “carvacrol” y “timol”. Estás moléculas podrían reemplazar a los conservantes sintéticos utilizados en la industria alimentaria. \n\nA partir de los extractos de canela y orégano se buscó determinar si poseían propiedades capaces de prolongar la vida útil de panificados mediante la observación de la inhibición del crecimiento microbiano y la preservación de sus características organolépticas.\n\nLa metodología aplicada consistió, en primera instancia, en la extracción de los compuestos mediante destilación por arrastre de vapor. Luego, realizamos una cromatografía en capa delgada (TLC) con el objetivo de corroborar la presencia de carvacrol y timol en el orégano, y de cinamaldehído en la canela. Se evidenció la presencia de compuestos compatibles con cinamaldehído, carvacrol y timol. Por último, realizamos el horneado del pan, donde probamos la efectividad de los extractos. Fue preparado con las extracciones en el amasado y luego horneados. Posteriormente, dejamos que los panes se hongueen para confirmar la actividad antimicrobiana. Para ello corroboramos la cantidad de hongo presente en el pan. \nComo resultado se observó que los panes que contenían extracto de canela y orégano presentaron un menor crecimiento de hongos, en relación con el control, siendo el primero el más efectivo. Estos resultados sugieren un efecto conservante prometedor, especialmente en el caso de la canela.",

    "Descripcion": "Comprobación de actividad antimicrobiana de un extracto con ácidos clorogénicos.\nEn la actualidad, un alto porcentaje de los alimentos que producimos se desperdician debido a su incipiente deterioramiento o porque ya no tienen relevancia en la industria alimenticia. Se consume 1,5 kg de café y 6,5 kg de yerba mate por persona al año en Argentina. Con el objetivo de utilizar estos residuos se comprobó la actividad antimicrobiana de los ácidos clorogénicos para su uso como conservante alimenticio. Durante este proceso se obtuvieron tres extractos utilizando diferentes metodologías de extracción y materias primas. En el primer extracto se utilizó borra de café y se obtuvo el extracto mediante una destilación y concentración de una solución acuosa al 1 en 5 de borra de café y agua destilada. Al obtenerse el extracto se probó en diferentes concentraciones utilizando diluciones seriadas al ½ mediante la técnica de antibiograma. En el segundo extracto se utilizó borra de café obtenido mediante la técnica de extracción por ultrasonido, y en el tercer extracto se utilizó yerba mate mediante el mismo procedimiento de extracción. Los tres extractos se probaron en E.coli y en S. aureus obteniendo resultados no congruentes con la hipótesis. Esto se puede deber a la baja concentración de ACG en los extractos, a la ausencia o baja concentración de ACG en estos residuos o a una extracción ineficiente de estos. En conclusión no se evidenció actividad antimicrobiana en los extractos que obtuvimos pero no pudimos comprobar la actividad antimicrobiana de los ácidos clorogénicos.",

    "Descripcion": "En este proyecto nos propusimos extraer aminoácidos con propiedades fotoprotectoras, específicamente aminoácidos tipo micosporina (MAAs), presentes en el alga Nori, conocidos por su capacidad de absorber radiación UV.\nEl objetivo fue evaluar su potencial uso en fotoprotección dentro del rango UV. Para ello, realizamos una extracción mediante solventes de distinta polaridad (agua y etanol), seguida de ensayos de separación mediante cromatografía. Si bien no se lograron perfiles cromatográficos concluyentes, los resultados sugieren la presencia de compuestos compatibles con MAAs, lo que constituye una validación parcial de la hipótesis.\nPosteriormente, se diseñaron ensayos biológicos utilizando cultivos de E.coli para evaluar el posible efecto fotoprotector de los extractos frente a radiación UV. Se trabajó con distintas diluciones (técnica que se usa para reducir la concentración de bacterias en una muestra líquida) y condiciones de exposición, lo que permitió explorar múltiples variables experimentales. Sin embargo, factores como la inestabilidad del medio de cultivo y posibles limitaciones en la concentración o disponibilidad de los compuestos impidieron obtener resultados concluyentes por lo que tuvimos que realizar esta prueba nuevamente pero con una optimización del medio de cultivo. Tran sacar de la estufa las nuevas placas nos dio los resultados\nComo resultado final de las placas logramos observar una menor cantidad de bacterias en la placa expuesta a UV sin extracto, verificando su capacidad de proteger células ante la radiación UV, es decir, vimos parcialmente el efecto que esperábamos ver en las placas.\nEn conclusión, podríamos mejorar la extracción y aplicación del alga Nori para poder usarlo como potencial protector UV que busque proteger el impacto que podría tener este en la piel humana.",
